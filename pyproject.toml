[project]
name = "ipodfw"
version = "0.1.0"
description = "Customise Apple's stock firmware on the iPod Video 5G/5.5G (macOS, Apple Silicon)"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
dependencies = ["pillow>=10"]

[project.scripts]
ipodfw = "ipodfw.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ipodfw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
